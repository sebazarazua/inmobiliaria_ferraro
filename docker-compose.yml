services:
  postgres:
    image: postgres:17-alpine
    container_name: ferraro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inmobiliaria
      POSTGRES_USER: ferraro
      POSTGRES_PASSWORD: ferraro_local
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ferraro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferraro -d inmobiliaria"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  ferraro_postgres_data:
